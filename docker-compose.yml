version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobqueue-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jobqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobqueue-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobqueue-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/jobqueue
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-distributed-job-queue-key-change-in-prod-2026
      - ADMIN_EMAIL=admin@jobqueue.io
      - ADMIN_PASSWORD=Admin@123456
    ports:
      - "8000:8000"

  worker-1:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: jobqueue-worker-1
    restart: always
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/jobqueue
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ID=worker-node-alpha-1
    command: ["python", "worker.py"]

  worker-2:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: jobqueue-worker-2
    restart: always
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/jobqueue
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ID=worker-node-beta-2
    command: ["python", "worker.py"]

  reaper:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: jobqueue-reaper
    restart: always
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/jobqueue
      - REDIS_URL=redis://redis:6379/0
    command: ["python", "reaper.py"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobqueue-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: jobqueue-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: jobqueue-grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
